<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply / Contact · Human Agency</title><meta name="description" content="Human Agency — talent representation for anime, webtoons, comics and the creators, streamers and stars around them.">
<link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="logo" href="index.html">HUMAN<span>AGENCY</span></a><nav><a href="index.html">Home</a><a href="talent.html">Talent</a><a href="roster.html">Roster</a><a href="services.html">Services</a><a href="about.html">About</a><a href="apply.html" class=active>Apply / Contact</a></nav></header>
<main><section class="narrow"><h1>Apply or get in touch</h1><p class="lead">No account needed. Submitting opens your email app with the details pre-filled.</p>
<form id="f"><div class="seg"><label><input type="radio" name="type" value="Talent application" checked> I'm talent</label><label id="brand"><input type="radio" name="type" value="Brand / booking inquiry"> I'm a brand / studio / event</label></div>
<label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label>
<label>Category<select name="category"><option>Manga &amp; Comic Artists</option><option>Webtoon Creators</option><option>Illustrators</option><option>Writers &amp; Scriptwriters</option><option>Animators</option><option>Voice Actors</option><option>VTubers</option><option>Streamers</option><option>Content Creators</option><option>Influencers</option><option>Cosplayers</option><option>Models</option><option>Actors</option><option>Celebrities</option><option>Musicians &amp; Singers</option><option>Dancers &amp; Performers</option><option>Game &amp; Esports Talent</option><option>Podcasters &amp; Critics</option><option>Photographers &amp; Directors</option><option>Translators &amp; Localizers</option><option>Other</option></select></label>
<label>Links (portfolio, socials, channel)<input name="links" placeholder="https://"></label>
<label>Message<textarea name="msg" rows="5"></textarea></label><button class="btn" type="submit">Send</button></form></section>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);const s=`${d.get('type')}: ${d.get('name')}`;const b=[...d.entries()].map(([k,v])=>k+': '+v).join('\n');location.href='mailto:hello@humanagency.example?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(b);};</script></main>
<footer><p>© 2026 Human Agency · Talent for anime, webtoons & comics</p><p><a href="apply.html">Join the roster</a> · <a href="mailto:hello@humanagency.example">hello@humanagency.example</a></p></footer>
</body></html>
