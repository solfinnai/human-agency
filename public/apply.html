<header class="nav"><a class="logo" href="index.html">HUMAN<span>AGENCY</span></a><nav><a href="index.html">Home</a><a href="talent.html">Talent</a><a href="roster.html">Roster</a><a href="services.html">Services</a><a href="about.html">About</a><a href="apply.html" class=active>Apply / Contact</a></nav></header>
<main><section class="narrow"><h1>Apply or get in touch</h1><p class="lead">No account needed. Submitting opens your email app with the details pre-filled.</p>
<form id="f"><div class="seg"><label><input type="radio" name="type" value="Talent application" checked> I'm talent</label><label id="brand"><input type="radio" name="type" value="Brand / booking inquiry"> I'm a brand / studio / event</label></div>
<label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label>
<label>Desk / niche<select name="category"><option>Webtoon, Comic &amp; Manga Creators</option><option>Cosplayers</option><option>Voice Actors</option><option>Indie VTubers</option><option>Anime &amp; Gaming Creators</option><option>Gaming &amp; Streaming</option><option>Esports</option><option>Tabletop, TTRPG &amp; Board Games</option><option>Animation</option><option>K-pop, J-pop &amp; Idol Culture</option><option>Film &amp; Hollywood</option><option>Music</option><option>Dance</option><option>Podcasting &amp; Audio</option><option>Comedy</option><option>True Crime, Mystery &amp; Paranormal</option><option>Magic &amp; Variety Arts</option><option>Art &amp; Illustration</option><option>Photography &amp; Filmmaking (craft)</option><option>Books, BookTok &amp; Publishing</option><option>Design &amp; Architecture</option><option>AI</option><option>Tech &amp; Gadgets</option><option>Crypto &amp; Web3</option><option>Business, Startups &amp; Careers</option><option>Finance &amp; Investing</option><option>Kids &amp; Family Entertainment</option><option>Drag, Nightlife &amp; LGBTQ+ Culture</option><option>Faith &amp; Spirituality</option><option>Parenting &amp; Family</option><option>Fashion</option><option>Beauty &amp; Skincare</option><option>Luxury &amp; Watches</option><option>Food &amp; Cooking</option><option>Beverages: Wine, Coffee &amp; Mixology</option><option>Travel &amp; Hospitality</option><option>Lifestyle, Vlogging &amp; ASMR</option><option>Outdoors &amp; Adventure</option><option>Pets &amp; Animals</option><option>Cars &amp; Motorsport</option><option>Home, DIY &amp; Interior</option><option>Gardening &amp; Homesteading</option><option>Weddings &amp; Events</option><option>Fitness &amp; Strength</option><option>Wellness, Yoga &amp; Mindfulness</option><option>Health &amp; Medicine</option><option>Education &amp; Learning</option><option>Science &amp; Nature</option><option>Sustainability &amp; Climate</option><option>Action &amp; Board Sports</option><option>Sports (pro, Olympic &amp; NIL)</option><option>Other</option></select></label>
<label>Links (portfolio, socials, channel)<input name="links" placeholder="https://"></label>
<label>Message<textarea name="msg" rows="5"></textarea></label><button class="btn" type="submit">Send</button></form></section>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);const s=`${d.get('type')}: ${d.get('name')}`;const b=[...d.entries()].map(([k,v])=>k+': '+v).join('\n');location.href='mailto:hello@humanagency.example?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(b);};</script></main>

</body></html>
